<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>꼬마 비행기 1942 - 유아용 슈팅 게임</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jua', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            background: linear-gradient(to bottom, #87CEEB, #E0F6FF);
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }
        canvas {
            display: block;
            background: transparent;
        }
        .bounce-btn {
            transition: transform 0.1s ease, filter 0.1s ease;
        }
        .bounce-btn:active {
            transform: scale(0.92);
            filter: brightness(0.9);
        }
        @keyframes floatAnim {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .floating {
            animation: floatAnim 2s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-between h-screen w-screen overflow-hidden">

    <div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col justify-between p-4 z-10">
        <!-- Top HUD -->
        <div class="flex justify-between items-center w-full max-w-2xl mx-auto bg-white/80 backdrop-blur-md px-6 py-3 rounded-full shadow-lg pointer-events-auto border-4 border-amber-300">
            <div class="flex items-center gap-2">
                <span class="text-3xl">❤️</span>
                <span id="score-display" class="text-2xl md:text-3xl text-pink-600">점수: 0</span>
            </div>
            <div class="flex items-center gap-1">
                <span id="star-count" class="text-2xl md:text-3xl text-yellow-500">⭐ 0</span>
            </div>
            <button onclick="toggleSound()" id="sound-btn" class="bg-yellow-400 hover:bg-yellow-500 text-white p-2 rounded-full text-xl shadow bounce-btn cursor-pointer">
                🔊
            </button>
        </div>

        <!-- Floating Encouragement Banner -->
        <div id="praise-banner" class="opacity-0 transition-opacity duration-500 self-center bg-yellow-300/90 border-4 border-white text-orange-700 px-6 py-2 rounded-full text-2xl md:text-3xl shadow-xl transform -translate-y-4">
            🎉 최고야! 멋져요! 🌟
        </div>

        <!-- Bottom Controls & Joypad / Instructions -->
        <div class="flex justify-between items-end w-full max-w-2xl mx-auto pb-2 pointer-events-auto">
            <div class="bg-white/60 backdrop-blur-sm px-4 py-2 rounded-2xl border-2 border-white text-slate-700 text-sm md:text-base shadow">
                💡 비행기를 꾹 누르고 움직이거나 화면을 터치해봐요!
            </div>
            <button onclick="resetGame()" class="bg-gradient-to-r from-pink-400 to-rose-400 text-white font-bold px-5 py-3 rounded-full shadow-lg border-4 border-white text-lg bounce-btn cursor-pointer">
                🔄 다시하기
            </button>
        </div>
    </div>

    <div id="start-screen" class="absolute inset-0 bg-sky-400/90 backdrop-blur-md z-30 flex flex-col items-center justify-center p-6 text-center">
        <div class="bg-white p-8 rounded-3xl shadow-2xl border-8 border-yellow-300 max-w-md w-full floating">
            <div class="text-6xl mb-4">✈️🌈</div>
            <h1 class="text-4xl md:text-5xl text-pink-500 font-bold mb-3">꼬마 비행기 1942</h1>
            <p class="text-slate-600 text-lg mb-6">알록달록 풍선과 구름 친구들을 맞추고 별사탕을 모아봐요!</p>
            <button onclick="startGame()" class="bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white font-bold text-2xl py-4 px-10 rounded-full shadow-lg border-4 border-white bounce-btn cursor-pointer w-full">
                게임 시작! 🚀
            </button>
        </div>
    </div>

    <canvas id="gameCanvas" class="absolute inset-0 w-full h-full z-0"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Canvas sizing
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Audio Context setup using Web Audio API for cute 8-bit sound effects
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'shoot') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(400, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'pop') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.12);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                osc.start(now);
                osc.stop(now + 0.12);
            } else if (type === 'star') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, now); // D5
                osc.frequency.setValueAtTime(880, now + 0.08); // A5
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById('sound-btn').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // Game State
        let gameRunning = false;
        let score = 0;
        let starsCount = 0;
        let frameCount = 0;

        // Player object (Red cute biplane)
        let player = {
            x: canvas.width / 2,
            y: canvas.height - 120,
            w: 60,
            h: 60,
            speed: 5,
            targetX: canvas.width / 2,
            targetY: canvas.height - 120,
            isDragging: false
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let floatingTexts = [];

        // Input controls (Mouse & Touch drag)
        function handleTouchStart(e) {
            initAudio();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            player.isDragging = true;
            player.targetX = clientX;
            player.targetY = clientY;
        }

        function handleTouchMove(e) {
            if (!player.isDragging) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            player.targetX = clientX;
            player.targetY = clientY;
        }

        function handleTouchEnd() {
            player.isDragging = false;
        }

        window.addEventListener('mousedown', handleTouchStart);
        window.addEventListener('mousemove', handleTouchMove);
        window.addEventListener('mouseup', handleTouchEnd);

        window.addEventListener('touchstart', handleTouchStart, { passive: true });
        window.addEventListener('touchmove', handleTouchMove, { passive: true });
        window.addEventListener('touchend', handleTouchEnd);

        // Keyboard arrow controls support
        const keys = {};
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            score = 0;
            starsCount = 0;
            bullets = [];
            enemies = [];
            particles = [];
            player.x = canvas.width / 2;
            player.y = canvas.height - 150;
            player.targetX = player.x;
            player.targetY = player.y;
            gameRunning = true;
            updateUI();
        }

        function resetGame() {
            startGame();
        }

        function updateUI() {
            document.getElementById('score-display').innerText = `점수: ${score}`;
            document.getElementById('star-count').innerText = `⭐ ${starsCount}`;
        }

        function triggerPraise(text) {
            const banner = document.getElementById('praise-banner');
            banner.innerText = text;
            banner.style.opacity = '1';
            setTimeout(() => {
                banner.style.opacity = '0';
            }, 1500);
        }

        function spawnEnemies() {
            if (frameCount % 60 === 0) {
                const types = ['balloon', 'cloud', 'blimp', 'starplane'];
                const type = types[Math.floor(Math.random() * types.length)];
                
                enemies.push({
                    x: Math.random() * (canvas.width - 80) + 40,
                    y: -60,
                    w: type === 'blimp' ? 70 : 50,
                    h: type === 'blimp' ? 50 : 50,
                    speed: Math.random() * 1.5 + 1,
                    type: type,
                    health: type === 'blimp' ? 3 : 1,
                    maxHealth: type === 'blimp' ? 3 : 1,
                    angle: 0
                });
            }
        }

        function update() {
            if (!gameRunning) return;

            frameCount++;

            // Keyboard navigation
            if (keys['ArrowLeft']) player.targetX -= 8;
            if (keys['ArrowRight']) player.targetX += 8;
            if (keys['ArrowUp']) player.targetY -= 8;
            if (keys['ArrowDown']) player.targetY += 8;

            // Smooth interpolation towards target position
            player.x += (player.targetX - player.x) * 0.15;
            player.y += (player.targetY - player.y) * 0.15;

            // Boundaries
            player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
            player.y = Math.max(60, Math.min(canvas.height - 80, player.y));

            // Auto firing bullets every 15 frames
            if (frameCount % 15 === 0) {
                bullets.push({ x: player.x, y: player.y - 30, r: 8 });
                playSound('shoot');
            }

            // Update bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= 12;
                if (bullets[i].y < -20) {
                    bullets.splice(i, 1);
                }
            }

            // Spawn enemies
            spawnEnemies();

            // Update enemies
            for (let i = enemies.length - 1; i >= 0; i--) {
                let en = enemies[i];
                en.y += en.speed;
                en.angle += 0.05;

                // Out of screen
                if (en.y > canvas.height + 60) {
                    enemies.splice(i, 1);
                    continue;
                }

                // Check bullet collision
                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    let dist = Math.hypot(en.x - b.x, en.y - b.y);
                    if (dist < en.w / 2 + b.r) {
                        // Bullet hit!
                        bullets.splice(j, 1);
                        en.health--;

                        // Create bubble explosion particles
                        for (let p = 0; p < 8; p++) {
                            particles.push({
                                x: b.x,
                                y: b.y,
                                vx: (Math.random() - 0.5) * 6,
                                vy: (Math.random() - 0.5) * 6,
                                r: Math.random() * 8 + 4,
                                color: ['#FF6B6B', '#4D96FF', '#6BCB77', '#FFD93D'][Math.floor(Math.random()*4)],
                                alpha: 1
                            });
                        }

                        if (en.health <= 0) {
                            playSound('pop');
                            score += en.type === 'blimp' ? 300 : 100;
                            starsCount += 1;
                            updateUI();

                            if (score % 1000 === 0) {
                                triggerPraise('🌟 대단해요! 천재 파일럿! 🚀');
                            } else if (score % 500 === 0) {
                                triggerPraise('💖 참 잘했어요! 와아~ 🎉');
                            }

                            // Star candy drop effect
                            playSound('star');
                            enemies.splice(i, 1);
                            break;
                        }
                    }
                }
            }

            // Update particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let pt = particles[i];
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.03;
                if (pt.alpha <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw cute background clouds scrolling
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc((frameCount * 0.5) % (canvas.width + 200) - 100, 150, 40, 0, Math.PI * 2);
            ctx.arc((frameCount * 0.5) % (canvas.width + 200) - 60, 140, 50, 0, Math.PI * 2);
            ctx.arc((frameCount * 0.3) % (canvas.width + 300) - 150, 350, 60, 0, Math.PI * 2);
            ctx.fill();

            // Draw Bullets (Bubbles)
            for (let b of bullets) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#4D96FF';
                ctx.lineWidth = 2;
                ctx.stroke();
                // Bubble highlight
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(b.x - 3, b.y - 3, 2, 0, Math.PI * 2);
                ctx.fill();
            }

            // Draw Enemies
            for (let en of enemies) {
                ctx.save();
                ctx.translate(en.x, en.y);

                if (en.type === 'balloon') {
                    // Cute Smiling Balloon
                    ctx.fillStyle = '#FF6B6B';
                    ctx.beginPath();
                    ctx.arc(0, 0, 25, 0, Math.PI * 2);
                    ctx.fill();
                    // Face
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath();
                    ctx.arc(-8, -4, 4, 0, Math.PI * 2);
                    ctx.arc(8, -4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000000';
                    ctx.beginPath();
                    ctx.arc(-8, -4, 1.5, 0, Math.PI * 2);
                    ctx.arc(8, -4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                    // Smile
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 2, 8, 0, Math.PI, false);
                    ctx.stroke();
                } else if (en.type === 'cloud') {
                    // Smiling Cloud Monster
                    ctx.fillStyle = '#F8F9FA';
                    ctx.beginPath();
                    ctx.arc(-10, 0, 18, 0, Math.PI * 2);
                    ctx.arc(10, 0, 18, 0, Math.PI * 2);
                    ctx.arc(0, -10, 20, 0, Math.PI * 2);
                    ctx.fill();
                    // Face
                    ctx.fillStyle = '#495057';
                    ctx.beginPath();
                    ctx.arc(-6, -4, 3, 0, Math.PI * 2);
                    ctx.arc(6, -4, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#495057';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 2, 6, 0, Math.PI, false);
                    ctx.stroke();
                } else if (en.type === 'blimp') {
                    // Cute Blimp / Airship
                    ctx.fillStyle = '#FFD93D';
                    ctx.beginPath();
                    ctx.ellipse(0, 0, 35, 22, 0, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#FFA500';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    // Face
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(-10, -2, 3, 0, Math.PI * 2);
                    ctx.arc(10, -2, 3, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Cute Mini Star Plane
                    ctx.fillStyle = '#6BCB77';
                    ctx.beginPath();
                    ctx.arc(0, 0, 22, 0, Math.PI * 2);
                    ctx.fill();
                    // Wings
                    ctx.fillStyle = '#4E9F3D';
                    ctx.fillRect(-30, -6, 60, 6);
                    // Face
                    ctx.fillStyle = '#FFF';
                    ctx.beginPath();
                    ctx.arc(-6, -2, 3, 0, Math.PI * 2);
                    ctx.arc(6, -2, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            }

            // Draw Particles (Bubble Pop / Star Sparkles)
            for (let pt of particles) {
                ctx.save();
                ctx.globalAlpha = pt.alpha;
                ctx.fillStyle = pt.color;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, pt.r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            // Draw Player (Red Cute Biplane)
            ctx.save();
            ctx.translate(player.x, player.y);

            // Plane shadow / propeller blur
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            ctx.beginPath();
            ctx.ellipse(0, 35, 25, 8, 0, 0, Math.PI * 2);
            ctx.fill();

            // Main Red Body
            ctx.fillStyle = '#FF416C';
            ctx.beginPath();
            ctx.ellipse(0, 0, 24, 34, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#D72638';
            ctx.lineWidth = 3;
            ctx.stroke();

            // Wings (Yellow)
            ctx.fillStyle = '#FFD166';
            ctx.fillRect(-40, -10, 80, 14);
            ctx.strokeStyle = '#F4A261';
            ctx.lineWidth = 2;
            ctx.strokeRect(-40, -10, 80, 14);

            // Cute Pilot Face in Cockpit
            ctx.fillStyle = '#87CEEB';
            ctx.beginPath();
            ctx.arc(0, -6, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#FFFFFF';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Pilot Goggles & Helmet
            ctx.fillStyle = '#4A5568';
            ctx.beginPath();
            ctx.arc(0, -10, 12, Math.PI, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.beginPath();
            ctx.arc(-4, -6, 3, 0, Math.PI * 2);
            ctx.arc(4, -6, 3, 0, Math.PI * 2);
            ctx.fill();

            // Spinning Propeller
            ctx.fillStyle = '#333333';
            let propWidth = Math.sin(frameCount * 0.5) * 24;
            ctx.fillRect(-propWidth / 2, -42, propWidth, 6);

            ctx.restore();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
